# Actualizaciones automáticas de dependencias.
#
# Tres ecosistemas: npm en la raíz (la app Next.js), pip en /processor (el
# worker Python) y las propias GitHub Actions de .github/workflows.
#
# Cómo se agrupa, y por qué:
#   - Nada de versiones mayores: esas se deciden y se hacen en una rama propia.
#     Prisma queda en 5.22: tampoco sube de menor.
#   - Next y React van juntos, porque se prueban juntos. Los paquetes de AWS,
#     juntos.
#   - El grupo grande de la semana es SOLO de parches. Las menores de lo demás
#     llegan de a una, y el cupo de PRs abiertos las limita.
#   - pip usa increase-if-necessary: los requisitos son rangos (>=x,<y) y sólo
#     vale abrir un PR cuando la versión nueva queda AFUERA del rango. Subir el
#     piso de un rango que ya la incluía no cambia nada de lo que se instala.
#
# Un PR de Dependabot se revisa como cualquier cambio (docs/como-trabajamos.md):
# un CI verde no reemplaza leer qué sube. Las actualizaciones de seguridad
# entran igual aunque haya reglas de ignore o el cupo esté lleno.

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule: { interval: "weekly", day: "monday" }
    open-pull-requests-limit: 4
    commit-message: { prefix: "deps" }
    ignore:
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      next-react:
        patterns: ["next", "eslint-config-next", "react", "react-dom", "@types/react", "@types/react-dom"]
      aws:
        patterns: ["@aws-sdk/*"]
      parches:
        patterns: ["*"]
        exclude-patterns: ["next", "eslint-config-next", "react", "react-dom", "@aws-sdk/*", "playwright"]
        update-types: ["patch"]

  - package-ecosystem: "pip"
    directory: "/processor"
    schedule: { interval: "monthly" }
    open-pull-requests-limit: 2
    versioning-strategy: "increase-if-necessary"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message: { prefix: "deps(processor)" }

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "monthly" }
    open-pull-requests-limit: 2
    groups:
      acciones: { patterns: ["*"] }
    commit-message: { prefix: "ci" }
