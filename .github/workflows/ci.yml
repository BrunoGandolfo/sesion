# ============================================================================
# CI básico para Sesión.
#
# Corre en cada push a main y en cada PR contra main, antes de que Vercel
# auto-deploye. Si rompe el build / typecheck / lint / tests, nos enteramos
# acá y no en producción.
#
# Cuatro jobs en paralelo:
#   - typecheck: tsc --noEmit
#   - build:     next build
#   - lint:      eslint
#   - test:      vitest run (incluye tests de integración contra la DB de test)
#
# Notas:
#   - postinstall del package.json ya corre `prisma generate`, pero igual lo
#     llamamos explícito después de npm ci por si en el futuro alguien lo saca.
#   - Prisma necesita DATABASE_URL para `generate` (parsea el schema, no se
#     conecta), así que pasamos una URL dummy. NO usar la DB real acá.
#   - Next build también lee DATABASE_URL al evaluar rutas que la importan;
#     la dummy alcanza porque no se ejecuta ninguna query en build time.
#   - src/lib/db.ts construye el cliente Prisma al importarse y pasa por
#     withEncryption() (src/lib/prisma-encryption.ts), que llama validateKey()
#     (src/lib/encryption.ts): NOTES_ENCRYPTION_KEY tiene que existir y
#     decodificar en base64 a exactamente 32 bytes, si no el import lanza.
#     Por eso typecheck, build y test reciben una clave dummy: 32 bytes en
#     cero, codificados en base64. No cifra nada real; solo pasa el guard.
# ============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Si llega un push nuevo a la misma branch/PR, cancelamos la corrida anterior
# en vez de encolar — ahorra minutos y feedback más rápido.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # DATABASE_URL dummy: prisma generate y next build solo necesitan que la
  # variable exista y sea parseable como URL de Postgres. No se conecta a nada.
  DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Dummy: 32 bytes 0x00 en base64 (44 chars). Ver nota en el encabezado.
      NOTES_ENCRYPTION_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Generar Prisma Client
        run: npx prisma generate

      - name: Chequear tipos
        run: npx tsc --noEmit

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Dummy: 32 bytes 0x00 en base64 (44 chars). Ver nota en el encabezado.
      NOTES_ENCRYPTION_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Generar Prisma Client
        run: npx prisma generate

      - name: Build de Next.js
        run: npm run build

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar ESLint
        run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # src/lib/__tests__/prisma-encryption.test.ts lanza al importarse si
      # DATABASE_URL_TEST no está definida (líneas 54-58). Debe apuntar a una
      # rama de Neon dedicada a tests con todas las migraciones aplicadas:
      # el test hace TRUNCATE ... CASCADE en cada caso. NUNCA la DB de prod.
      DATABASE_URL_TEST: ${{ secrets.DATABASE_URL_TEST }}
      # Mismo dummy que typecheck/build. Los tests de cifrado sobreescriben la
      # variable con una clave aleatoria propia (líneas 69, 115, 126), pero el
      # resto de la suite puede importar src/lib/db.ts y necesita el guard.
      NOTES_ENCRYPTION_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Generar Prisma Client
        run: npx prisma generate

      - name: Ejecutar tests
        run: npm test
