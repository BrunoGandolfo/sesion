# ============================================================================
# CI de Sesión.
#
# Corre en cada push a main y en cada PR contra main. Vercel NO mira main:
# publica desde la rama `release`. Publicar requiere elegir a mano un SHA de
# main con CI verde y aplicar primero las migraciones (ver publicar.yml).
# El verde de acá habilita esa decisión; por sí solo no publica nada.
#
# Jobs, todos en paralelo:
#   - typecheck: tsc --noEmit
#   - build:     next build
#   - lint:      eslint
#   - test:      vitest run, con un Postgres 17 EFÍMERO por corrida (service
#                container). Nada comparte base con nadie: ni con otra
#                corrida, ni con la laptop de nadie, ni con Neon.
#   - guardias:  drift de migraciones, migraciones destructivas sin marca,
#                maxDuration en toda ruta, acta de restauración vigente.
#   - audit:     npm audit, BLOQUEANTE en high; moderate informa y no frena.
#                Con npm 11 instalado en el runner: es el que habla sólo con
#                el endpoint de avisos en lote (el `quick` está retirado).
#   - worker-tests: pytest + pip-audit del worker Python.
#
# Notas:
#   - postinstall del package.json ya corre `prisma generate`; se llama igual
#     explícito por si alguien lo saca.
#   - Prisma necesita DATABASE_URL para `generate` (parsea el schema, no se
#     conecta): la dummy alcanza. El job `test` la pisa a nivel step con la
#     del contenedor para `migrate deploy`.
#   - src/lib/db.ts construye el cliente Prisma al importarse y la extensión
#     de cifrado valida la clave al construirse. Van claves dummy (32 bytes en
#     cero, base64) en las DOS variables que conviven durante la
#     reconstrucción: NOTES_ENCRYPTION_KEY (formato ENC1) y CLAVES_CIFRADO
#     (llavero "1=<base64>", formato ENC2). No cifran nada real.
#   - No hay `concurrency` en `test`: con base propia por corrida no hay nada
#     que serializar. La de arriba sólo cancela corridas viejas del mismo ref.
#   - Dependabot no recibe secrets: este workflow no usa ninguno, así que sus
#     PRs corren la suite completa y un verde de Dependabot es mergeable.
# ============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A mano sobre cualquier rama (gh workflow run CI --ref <rama>): es como un
  # agente demuestra el verde antes de que el orquestador fusione. No publica
  # nada: publicar.yml exige un pedido manual y CI verde de un push a main.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
  NOTES_ENCRYPTION_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
  CLAVES_CIFRADO: "1=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - name: Instalar dependencias
        run: npm ci
      - name: Generar Prisma Client
        run: npx prisma generate
      - name: Chequear tipos
        run: npx tsc --noEmit

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - name: Instalar dependencias
        run: npm ci
      - name: Generar Prisma Client
        run: npx prisma generate
      - name: Build de Next.js
        run: npm run build

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - name: Instalar dependencias
        run: npm ci
      - name: Ejecutar ESLint
        run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Postgres 17 efímero: nace con el job y muere con él. Es lo que hace que
    # un rojo sea un rojo y un verde sea un verde (antes, una corrida local
    # en otra máquina vaciaba la misma rama de Neon a mitad de la suite).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sesion_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Local al runner. src/lib/__tests__/db-test.ts sólo acepta localhost
      # salvo PERMITIR_BASE_REMOTA_DE_TEST=1, que acá no está.
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/sesion_test
      # Para src/lib/__tests__/ensayo-restauracion.test.ts: pg_dump y
      # pg_restore de la misma versión que el servidor (el runner trae el
      # cliente 16, que no puede volcar un Postgres 17).
      PG_BIN: /usr/lib/postgresql/17/bin
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - name: Instalar dependencias
        run: npm ci
      - name: Generar Prisma Client
        run: npx prisma generate
      - name: Instalar postgresql-client-17
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          codename="$(lsb_release -cs)"
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${codename}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          "${PG_BIN}/pg_dump" --version
      - name: Aplicar migraciones a la base efímera
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sesion_test
        run: npx prisma migrate deploy
      - name: Ejecutar tests
        run: npm test

  guardias:
    name: Guardias
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Base sombra para `prisma migrate diff --from-migrations`: aplica las
    # migraciones en una base vacía y la compara con schema.prisma.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sesion_shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
        with:
          # Historia completa: el guardián de migraciones compara contra
          # origin/release para saber qué archivos .sql son nuevos.
          fetch-depth: 0
      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      - name: Instalar dependencias
        run: npm ci
      - name: Migraciones (drift y destructivas)
        env:
          SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sesion_shadow
        run: node scripts/ci/migraciones.mjs
      - name: Toda ruta declara maxDuration
        run: node scripts/ci/max-duration.mjs
      - name: Acta de restauración vigente
        run: node scripts/ci/acta-vigente.mjs

  audit:
    name: Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"
      # ── Por qué se instala npm 11 para auditar ────────────────────────
      # El 20 de septiembre este paso falló una vez con
      #   npm warn audit 400 Bad Request … This endpoint is being retired.
      #   Use the bulk advisory endpoint instead
      # y pasó al repetirlo. El mensaje confunde: no es que el repositorio
      # use un endpoint viejo. npm 10 (el que trae Node 22) pide PRIMERO el
      # endpoint vigente, /-/npm/v1/security/advisories/bulk, y sólo si ése
      # falla cae al retirado, /-/npm/v1/security/audits/quick. Lo que se ve
      # en el log es la SEGUNDA llamada: el aviso del retiro tapa la causa
      # real, que fue el fallo de la primera. Y como `npm audit` es un
      # comando de auditoría, cuando no consigue el informe LANZA, y el paso
      # se pone rojo.
      #
      # GitHub confirmó el retiro de /audits/quick y /audits después del 15
      # de julio de 2026, con apagones programados antes de esa fecha
      # (community discussion #192768). npm 11 (arborist 9) sacó la caída al
      # endpoint viejo: habla SÓLO con el de avisos en lote
      # (npm/cli#7911). Verificado en el fuente de npm 11.19.1.
      #
      # Con npm 11 el log deja de mentir y no se hace una llamada de más a un
      # endpoint que ya no existe. La FRECUENCIA de rojos no cambia: sigue
      # dependiendo del endpoint vigente, y un fallo del SERVICIO de npm
      # frena la publicación igual que una vulnerabilidad real. Eso es una
      # decisión del dueño y está propuesta en el reporte de la rama, sin
      # aplicar.
      #
      # Es una herramienta del runner, no una dependencia del proyecto:
      # package.json no se toca, y este job no corre `npm ci` ni escribe el
      # lockfile (sólo lo lee), así que no puede cambiarle la versión.
      - name: Usar npm 11 para auditar (endpoint vigente de avisos)
        run: npm install -g npm@^11

      # Sin `npm ci`: audit resuelve el árbol desde package-lock.json.
      # Bloqueante en high: una vulnerabilidad alta no se mergea, se arregla
      # o se documenta por qué no se puede (y entonces se ignora acá con
      # nombre y fecha, no bajando el nivel).
      - name: Auditar dependencias (high bloquea)
        run: npm audit --audit-level=high
      # Informativo: se ve en el log, no frena. Cuando aparece algo acá con
      # arreglo disponible, se arregla en el próximo PR de dependencias.
      - name: Auditar dependencias (moderate informa)
        continue-on-error: true
        run: npm audit --audit-level=moderate

  worker-tests:
    name: Worker tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: processor
    steps:
      - uses: actions/checkout@v5
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: processor/requirements-dev.txt
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt pip-audit
      # processor/audio_asr.py normaliza el audio con ffmpeg antes del ASR y
      # sus tests generan y miden WebM reales. Sin versión fija: los tests no
      # dependen de una (sólo de libopus y del filtro asetpts), la imagen del
      # worker (python:3.12-slim, Debian) ya trae otra, y fijar sólo el
      # paquete ffmpeg puede chocar con bibliotecas actualizadas del runner.
      - name: Instalar ffmpeg y ffprobe
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
          ffmpeg -version
          ffprobe -version
      - name: Ejecutar pytest
        run: python -m pytest tests -q
      # Nadie auditaba las dependencias de Python. Bloqueante desde el primer
      # día: el worker descarga audio clínico y habla con dos proveedores.
      - name: Auditar dependencias de Python
        run: pip-audit -r requirements.txt
