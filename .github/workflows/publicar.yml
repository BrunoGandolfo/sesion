# ============================================================================
# Publicación manual: main → release, eligiendo un SHA completo con CI verde.
#
# Un push a main o un CI exitoso NO publica. Bruno ejecuta Publicar desde main
# por workflow_dispatch y escribe el SHA que quiere publicar, después de probar
# en el teléfono. El workflow está HABILITADO y ya publicó: no hay ningún paso
# previo de habilitación (docs/operaciones.md). Estuvo deshabilitado durante la
# Fase 4 y esta cabecera se quedó diciéndolo.
#
# Antes de migrar se exige que el SHA pertenezca a main, contenga release y
# tenga su última corrida de CI de push en verde. Se verifica la conexión
# directa; después se aplican migraciones y recién entonces se avanza release.
# Vercel publica desde release; vercel.json mantiene apagado el deploy de main.
#
# Migraciones ANTES de avanzar release. Durante ese intervalo el código
# anterior puede ver un esquema más nuevo: las migraciones junto con código
# deben ser aditivas; las destructivas van en el despliegue siguiente, según
# scripts/ci/migraciones.mjs.
#
# El push es FAST-FORWARD, sin --force. Una divergencia se investiga, no se pisa.
# Los fallos de publicación siguen avisando. El aviso de CI rojo se conserva
# en avisar-ci.yml, separado y sin capacidad para migrar ni avanzar release.
#
# Secrets (Settings → Secrets and variables → Actions):
#   DATABASE_URL_PRODUCCION_DIRECTA  conexión DIRECTA de Neon (sin -pooler)
#   RESEND_API_KEY, ALERTA_CORREO    para las alertas por correo
# ============================================================================

name: Publicar

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "SHA completo de main que pasó CI"
        required: true
        type: string

# Una publicación por vez, en orden. Nunca cancelar una a medias: podría
# quedar la migración aplicada y release sin avanzar.
concurrency:
  group: publicar
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

env:
  DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"

jobs:
  publicar:
    name: Migrar producción y avanzar release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # El SHA pedido por el dueño; la guarda exige CI verde para ese SHA.
          ref: ${{ inputs.sha }}
          fetch-depth: 0

      - name: Verificar SHA y CI
        env:
          SHA: ${{ inputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" || ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: ejecutá desde main e indicá un SHA completo de 40 caracteres." >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$SHA" ]]; then
            echo "ERROR: el checkout no coincide con el SHA solicitado." >&2
            exit 1
          fi
          git merge-base --is-ancestor "$SHA" origin/main || {
            echo "ERROR: el SHA no pertenece a main." >&2; exit 1;
          }
          git merge-base --is-ancestor origin/release "$SHA" || {
            echo "ERROR: release no es antecesora del SHA; reconciliar antes de publicar." >&2; exit 1;
          }
          # La última corrida de CI para ese push debe haber terminado en verde.
          # Sin corrida, con API fallida o con una repetición pendiente, no se migra.
          CI=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$SHA" -f event=push -f branch=main -f per_page=1 \
            --jq '.workflow_runs[0] | [.head_sha, .status, .conclusion] | @tsv')
          if [[ "$CI" != "$SHA"$'\tcompleted\tsuccess' ]]; then
            echo "ERROR: el SHA solicitado no tiene su última corrida de CI de main en verde." >&2
            exit 1
          fi
          echo "SHA de main verificado, con CI verde y avance de release compatible."

      - name: Verificar secrets
        env:
          DATABASE_URL_PRODUCCION_DIRECTA: ${{ secrets.DATABASE_URL_PRODUCCION_DIRECTA }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL_PRODUCCION_DIRECTA:-}" ]; then
            echo "ERROR: falta el secret DATABASE_URL_PRODUCCION_DIRECTA." >&2
            exit 1
          fi
          case "${DATABASE_URL_PRODUCCION_DIRECTA}" in
            *-pooler*)
              echo "ERROR: DATABASE_URL_PRODUCCION_DIRECTA apunta al pooler; las migraciones van por la conexión directa." >&2
              exit 1 ;;
          esac

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Estado de las migraciones en producción (antes)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCCION_DIRECTA }}
        run: npx prisma migrate status || true

      - name: Aplicar migraciones a producción
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PRODUCCION_DIRECTA }}
        run: npx prisma migrate deploy

      - name: Avanzar release (fast-forward, sin force)
        env:
          SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          git push origin "${SHA}:refs/heads/release"
          echo "release → ${SHA}"

      - name: Avisar si algo falló
        if: failure()
        uses: ./.github/actions/alerta-correo
        with:
          asunto: "La publicación de main a release falló"
          texto: |
            No se publicó ${{ inputs.sha }} (${{ github.actor }}).
            Si falló la migración, la base puede haber quedado a medias: revisar `prisma migrate status` antes de reintentar.
            Si falló el push, release divergió de main: no pisar, mirar quién empujó.
            Corrida: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERTA_CORREO: ${{ secrets.ALERTA_CORREO }}
