# ============================================================================
# Backup diario de la base de datos de Sesión a Cloudflare R2.
#
# Flujo:
#   secretos → pg_dump (formato custom) → pg_restore --list (¿es un dump
#   legible?) → gpg --symmetric (AES-256) → aws s3 cp a R2 → head-object →
#   copia mensual (día 1) → retención (30 días diarios, 12 meses mensuales)
#   → alerta por correo si algo falló.
#
# La clave del bucket usa timestamp en UTC con segundos, así dos corridas el
# mismo día (scheduled + manual, p. ej.) generan archivos distintos y no se
# pisan: el workflow es seguro de ejecutar N veces.
#
# Secrets requeridos (Settings → Secrets and variables → Actions). TODOS
# obligatorios: el primer paso falla si falta alguno. La alerta dejó de ser
# opcional: un backup que falla sin que nadie se entere es lo que pasó entre
# julio y septiembre de 2026 (dos meses sin una sola copia).
#   - DATABASE_URL              (Neon, producción, incluir sslmode=require)
#   - R2_ACCESS_KEY_ID          (token R2 con permiso Object Read/Write)
#   - R2_SECRET_ACCESS_KEY
#   - R2_BUCKET                 (solo el nombre, sin s3://)
#   - R2_ENDPOINT               (https://<accountid>.r2.cloudflarestorage.com)
#   - BACKUP_ENCRYPTION_KEY     (passphrase fuerte — guardarla offline también)
#   - RESEND_API_KEY            (alertas por correo)
#   - ALERTA_CORREO             (a quién)
#
# Cómo se prueba que esto sirve: .github/workflows/ensayo-restauracion.yml
# restaura el último backup en un Postgres efímero una vez por mes, y el
# dueño hace a mano el ensayo trimestral que descifra una nota
# (docs/operaciones.md §4).
# ============================================================================

name: Backup diario de base de datos

on:
  # 06:00 UTC = 03:00 America/Montevideo (UY no tiene DST, es UTC-3 fijo).
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: db-backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    name: Backup Postgres → R2
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      ALERTA_CORREO: ${{ secrets.ALERTA_CORREO }}
      PG_BIN: /usr/lib/postgresql/17/bin

    steps:
      # Sólo para la acción compuesta de alerta (vive en el repo).
      - uses: actions/checkout@v5

      # ---------------------------------------------------------------------
      # 0. Secretos primero. Si falta uno, se sabe acá y no en el paso 6.
      # ---------------------------------------------------------------------
      - name: Verificar secrets
        run: |
          set -euo pipefail
          faltan=""
          for v in DATABASE_URL R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET R2_ENDPOINT BACKUP_ENCRYPTION_KEY RESEND_API_KEY ALERTA_CORREO; do
            if [ -z "${!v:-}" ]; then faltan="${faltan} ${v}"; fi
          done
          if [ -n "${faltan}" ]; then
            echo "ERROR: faltan secrets:${faltan}" >&2
            exit 1
          fi
          echo "Secrets presentes."

      # ---------------------------------------------------------------------
      # 1. postgresql-client-17 (ubuntu-latest no lo trae). pg_dump debe ser
      #    >= al server. TODO: cuando Neon pase a Postgres 18, cambiar acá,
      #    en ensayo-restauracion.yml, en ci.yml y en docker-compose.yml.
      # ---------------------------------------------------------------------
      - name: Instalar postgresql-client-17
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          codename="$(lsb_release -cs)"
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${codename}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          "${PG_BIN}/pg_dump" --version

      # ---------------------------------------------------------------------
      # 2. Nombre del backup (UTC con segundos) y si hoy toca copia mensual.
      # ---------------------------------------------------------------------
      - name: Calcular nombre del backup
        run: |
          set -euo pipefail
          stamp="$(date -u +'%Y-%m-%d-%H%M%S')"
          file="sesion-backup-${stamp}.dump"
          echo "BACKUP_FILE=${file}" >> "$GITHUB_ENV"
          echo "BACKUP_KEY=backups/${file}.gpg" >> "$GITHUB_ENV"
          echo "BACKUP_KEY_MENSUAL=backups/mensuales/${file}.gpg" >> "$GITHUB_ENV"
          if [ "$(date -u +'%d')" = "01" ]; then echo "ES_DIA_UNO=1" >> "$GITHUB_ENV"; else echo "ES_DIA_UNO=0" >> "$GITHUB_ENV"; fi
          echo "Archivo local: ${file}"

      # ---------------------------------------------------------------------
      # 3. pg_dump en formato custom. --no-owner / --no-privileges para poder
      #    restaurar en otra base con roles distintos.
      # ---------------------------------------------------------------------
      - name: Ejecutar pg_dump
        run: |
          set -euo pipefail
          "${PG_BIN}/pg_dump" \
            --format=custom \
            --no-owner \
            --no-privileges \
            --file="${BACKUP_FILE}" \
            "${DATABASE_URL}"
          ls -lh "${BACKUP_FILE}"

      # ---------------------------------------------------------------------
      # 4. ¿Es un backup? Antes sólo se comprobaba que el objeto subido pesara
      #    más de 0. `pg_restore --list` lee el índice del dump: si no tiene
      #    un catálogo legible con las tablas del esquema, no es un backup y
      #    no se sube.
      # ---------------------------------------------------------------------
      - name: Verificar que el dump se puede leer (pg_restore --list)
        run: |
          set -euo pipefail
          "${PG_BIN}/pg_restore" --list "${BACKUP_FILE}" > toc.txt
          tablas="$(grep -c 'TABLE DATA' toc.txt || true)"
          echo "Entradas TABLE DATA en el índice: ${tablas}"
          for t in organizaciones usuarios pacientes turnos sesiones_clinicas envios_sms; do
            if ! grep -q "TABLE DATA public ${t} " toc.txt; then
              echo "ERROR: el dump no contiene la tabla ${t}." >&2
              exit 1
            fi
          done
          echo "OK: índice legible, tablas del esquema presentes."

      # ---------------------------------------------------------------------
      # 5. Cifrado simétrico con gpg (AES-256). La passphrase entra por stdin
      #    para que nunca aparezca en la tabla de procesos.
      # ---------------------------------------------------------------------
      - name: Cifrar backup con gpg
        run: |
          set -euo pipefail
          printf '%s' "${BACKUP_ENCRYPTION_KEY}" | gpg \
            --batch --yes --quiet \
            --symmetric \
            --cipher-algo AES256 \
            --passphrase-fd 0 \
            --output "${BACKUP_FILE}.gpg" \
            "${BACKUP_FILE}"
          rm -f "${BACKUP_FILE}" toc.txt
          ls -lh "${BACKUP_FILE}.gpg"

      # ---------------------------------------------------------------------
      # 6. aws cli contra R2 (S3-compatible). Los flags de checksum
      #    deshabilitan el comportamiento nuevo del aws-cli v2.23+ que R2 no
      #    soporta en todas las rutas.
      # ---------------------------------------------------------------------
      - name: Configurar credenciales AWS CLI para R2
        run: |
          set -euo pipefail
          aws configure set aws_access_key_id "${R2_ACCESS_KEY_ID}"
          aws configure set aws_secret_access_key "${R2_SECRET_ACCESS_KEY}"
          aws configure set default.region auto
          aws configure set default.s3.request_checksum_calculation when_required
          aws configure set default.s3.response_checksum_validation when_required

      - name: Subir backup cifrado a R2
        run: |
          set -euo pipefail
          aws s3 cp "${BACKUP_FILE}.gpg" "s3://${R2_BUCKET}/${BACKUP_KEY}" \
            --endpoint-url "${R2_ENDPOINT}" --only-show-errors
          echo "Subido: s3://${R2_BUCKET}/${BACKUP_KEY}"

      - name: Verificar que el backup está en R2
        run: |
          set -euo pipefail
          meta="$(aws s3api head-object --bucket "${R2_BUCKET}" --key "${BACKUP_KEY}" \
            --endpoint-url "${R2_ENDPOINT}" --output json)"
          size="$(printf '%s' "${meta}" | jq -r '.ContentLength // 0')"
          local_size="$(stat -c %s "${BACKUP_FILE}.gpg")"
          if [ "${size}" -le 0 ] || [ "${size}" != "${local_size}" ]; then
            echo "ERROR: tamaño en R2 (${size}) distinto del local (${local_size})." >&2
            exit 1
          fi
          echo "OK: backup verificado (${size} bytes)."

      # ---------------------------------------------------------------------
      # 7. Copia mensual: el día 1 el mismo .gpg va también a
      #    backups/mensuales/. La retención diaria NUNCA toca ese prefijo.
      # ---------------------------------------------------------------------
      - name: Copia mensual (día 1)
        if: env.ES_DIA_UNO == '1'
        run: |
          set -euo pipefail
          aws s3 cp "s3://${R2_BUCKET}/${BACKUP_KEY}" "s3://${R2_BUCKET}/${BACKUP_KEY_MENSUAL}" \
            --endpoint-url "${R2_ENDPOINT}" --only-show-errors
          echo "Copia mensual: s3://${R2_BUCKET}/${BACKUP_KEY_MENSUAL}"

      # ---------------------------------------------------------------------
      # 8. Retención. Diarios: 30 días, sólo bajo backups/sesion-backup-*
      #    (el prefijo excluye mensuales/). Mensuales: 12 meses.
      # ---------------------------------------------------------------------
      - name: Limpiar diarios > 30 días y mensuales > 12 meses
        run: |
          set -euo pipefail
          borrar_anteriores_a() {
            local prefijo="$1" cutoff="$2"
            local keys
            keys="$(aws s3api list-objects-v2 --bucket "${R2_BUCKET}" --prefix "${prefijo}" \
              --endpoint-url "${R2_ENDPOINT}" \
              --query "Contents[?LastModified<'${cutoff}'].Key" --output text)"
            if [ -z "${keys}" ] || [ "${keys}" = "None" ]; then
              echo "Nada que borrar bajo ${prefijo} antes de ${cutoff}."
              return 0
            fi
            while IFS= read -r key; do
              [ -z "${key}" ] && continue
              echo "Borrando s3://${R2_BUCKET}/${key}"
              aws s3 rm "s3://${R2_BUCKET}/${key}" --endpoint-url "${R2_ENDPOINT}"
            done < <(printf '%s\n' "${keys}" | tr '\t' '\n')
          }
          borrar_anteriores_a "backups/sesion-backup-" "$(date -u -d '30 days ago' +'%Y-%m-%dT%H:%M:%SZ')"
          borrar_anteriores_a "backups/mensuales/"     "$(date -u -d '366 days ago' +'%Y-%m-%dT%H:%M:%SZ')"

      # ---------------------------------------------------------------------
      # 9. Alerta por correo si cualquier paso previo falló.
      # ---------------------------------------------------------------------
      - name: Avisar falla por correo
        if: failure()
        uses: ./.github/actions/alerta-correo
        with:
          asunto: "Backup diario de la base falló"
          texto: |
            El backup de hoy no se completó. Hasta que se arregle, el último backup válido es el del día anterior.
            Corrida: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
