# ============================================================================
# Ensayo mensual de restauración: ¿los respaldos sirven para volver a atender?
#
# Un backup que nunca se restauró es una esperanza. Una vez por mes (día 1,
# 04:00 Montevideo) y bajo demanda, este workflow, para DOS copias:
#
#   - la copia diaria más reciente (backups/sesion-backup-…), y
#   - la copia mensual MÁS VIEJA (backups/mensuales/…): es la que más
#     probablemente esté cifrada con una clave que la app ya retiró, y la
#     que nadie tocaría si no fuera por este ensayo;
#
#   1. levanta un Postgres 17 efímero y crea una base vacía por copia;
#   2. baja cada copia de R2 y la descifra con BACKUP_ENCRYPTION_KEY, la
#      restaura con pg_restore --exit-on-error (scripts/ensayo/restaurar.sh);
#   3. corre scripts/ensayo/verificar-restauracion.mjs: filas mínimas por
#      tabla (una base vacía falla), blobs ENC2 y censo del id de clave de
#      cada uno contra la lista de ids conocidos (un id que no está = datos
#      cifrados con una clave retirada o desconocida, y el ensayo falla
#      diciéndolo así, no como corrupción), filas huérfanas por clave foránea;
#   4. publica los resultados y la etapa/código de salida de cada intento
#      como artefactos y abre un issue con el acta;
#   5. alerta por correo si cualquier paso falla.
#
# DECISIÓN DELIBERADA: este ensayo NO descifra ninguna nota y no recibe
# ninguna clave clínica. Hacerlo exigiría el llavero en GitHub Actions, es
# decir, la clave de todo el histórico en un lugar más. El censo de ids no
# necesita la clave y detecta lo que importa: si hay datos que ningún
# llavero conocido abre. Lo que prueba la clave es el ensayo A MANO
# trimestral del dueño (scripts/ensayo/ensayo-manual.sh, docs/operaciones.md
# §4), que deja su acta en docs/operaciones/actas/ y que
# scripts/ci/acta-vigente.mjs reclama a los 100 días.
#
# Secrets: R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET, R2_ENDPOINT,
# BACKUP_ENCRYPTION_KEY, RESEND_API_KEY, ALERTA_CORREO (los mismos de
# backup.yml). GITHUB_TOKEN para el issue.
# Variable (Settings → Variables, no es secreta): CLAVES_CIFRADO_IDS="1,2":
# los ids de TODAS las claves que existen guardadas (la del llavero de la app
# y las retiradas que el dueño conserva para los respaldos). Solo ids, nunca
# valores.
# ============================================================================

name: Ensayo de restauración

on:
  schedule:
    # Día 1 de cada mes, 07:00 UTC = 04:00 Montevideo, una hora después del
    # backup de ese día.
    - cron: "0 7 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  ensayo:
    name: Restaurar la última copia diaria y la mensual más vieja
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
      CLAVES_CIFRADO_IDS: ${{ vars.CLAVES_CIFRADO_IDS }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      ALERTA_CORREO: ${{ secrets.ALERTA_CORREO }}
      PG_URL: postgresql://postgres:postgres@localhost:5432
      PG_BIN: /usr/lib/postgresql/17/bin

    steps:
      - uses: actions/checkout@v5

      - name: Verificar secrets
        run: |
          set -euo pipefail
          faltan=""
          for v in R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET R2_ENDPOINT BACKUP_ENCRYPTION_KEY RESEND_API_KEY ALERTA_CORREO; do
            if [ -z "${!v:-}" ]; then faltan="${faltan} ${v}"; fi
          done
          # Variable, no secret: solo ids de clave. Sin ella el censo no puede juzgar.
          if [ -z "${CLAVES_CIFRADO_IDS:-}" ]; then faltan="${faltan} CLAVES_CIFRADO_IDS(variable)"; fi
          if [ -n "${faltan}" ]; then echo "ERROR: faltan secrets o variables:${faltan}" >&2; exit 1; fi

      - name: Instalar postgresql-client-17
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          codename="$(lsb_release -cs)"
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${codename}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          "${PG_BIN}/pg_restore" --version

      - name: Configurar credenciales AWS CLI para R2
        run: |
          set -euo pipefail
          aws configure set aws_access_key_id "${R2_ACCESS_KEY_ID}"
          aws configure set aws_secret_access_key "${R2_SECRET_ACCESS_KEY}"
          aws configure set default.region auto
          aws configure set default.s3.request_checksum_calculation when_required
          aws configure set default.s3.response_checksum_validation when_required

      - name: Ensayar las dos copias por separado
        run: |
          set -euo pipefail
          fallo=0
          for etiqueta in diario mensual; do
            # Un Bash por copia: conserva errexit dentro del intento aunque
            # el padre capture su fallo para seguir con la otra copia.
            if ETIQUETA="$etiqueta" bash -euo pipefail <<'COPIA'
          etapa=listado
          export BACKUP_ARCHIVO="" BACKUP_FECHA=""
          registrar() {
            codigo=$?
            node --input-type=module - "$ETIQUETA" "$etapa" "$codigo" <<'ESTADO'
          import { writeFileSync } from 'node:fs';
          const [etiqueta, etapa, codigo] = process.argv.slice(2);
          writeFileSync(`estado-${etiqueta}.json`, JSON.stringify({
            etapa, codigo: Number(codigo),
            archivo: process.env.BACKUP_ARCHIVO || null,
            fechaArchivo: process.env.BACKUP_FECHA || null,
          }));
          ESTADO
          }
          trap registrar EXIT
          if [ "$ETIQUETA" = diario ]; then
            prefijo=backups/sesion-backup-
            indice=-1
            nombre=diaria
          else
            prefijo=backups/mensuales/
            indice=0
            nombre=mensual
          fi
          # Un prefijo vacío puede no traer Contents; sort_by necesita una lista.
          if ! BACKUP_ARCHIVO="$(aws s3api list-objects-v2 --bucket "${R2_BUCKET}" --prefix "$prefijo" \
            --endpoint-url "${R2_ENDPOINT}" \
            --query "sort_by(Contents || \`[]\`, &LastModified)[$indice].Key" --output text)"; then
            echo "ERROR: no se pudo listar el prefijo $prefijo." >&2
            exit 1
          fi
          if [ -z "$BACKUP_ARCHIVO" ] || [ "$BACKUP_ARCHIVO" = None ]; then
            BACKUP_ARCHIVO=""
            etapa=no_existe
            echo "ERROR: no hay ninguna copia $nombre bajo $prefijo." >&2
            exit 1
          fi
          echo "Copia $nombre: $BACKUP_ARCHIVO"
          etapa=metadatos
          BACKUP_FECHA="$(aws s3api head-object --bucket "${R2_BUCKET}" --key "$BACKUP_ARCHIVO" \
            --endpoint-url "${R2_ENDPOINT}" --query LastModified --output text)"
          etapa=descarga
          aws s3 cp "s3://${R2_BUCKET}/${BACKUP_ARCHIVO}" "$ETIQUETA.dump.gpg" --endpoint-url "${R2_ENDPOINT}" --only-show-errors
          etapa=base
          export DATABASE_URL="${PG_URL}/ensayo_${ETIQUETA}"
          "${PG_BIN}/psql" -X -v ON_ERROR_STOP=1 -c "CREATE DATABASE ensayo_${ETIQUETA}" "${PG_URL}/postgres"
          etapa=apertura
          scripts/ensayo/restaurar.sh "$ETIQUETA.dump.gpg" "${DATABASE_URL}"
          etapa=verificacion
          node scripts/ensayo/verificar-restauracion.mjs --etiqueta "$ETIQUETA"
          etapa=completado
          COPIA
            then
              echo "Copia $etiqueta: ensayo completo."
            else
              fallo=1
              echo "ERROR: el ensayo de la copia $etiqueta no se completó; su fallo no impide los demás intentos." >&2
            fi
          done
          exit "$fallo"

      - name: Borrar los archivos descifrables
        if: always()
        run: rm -f diario.dump.gpg mensual.dump.gpg

      - name: Publicar los resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ensayo-restauracion-${{ github.run_id }}
          path: |
            resultado-*.json
            estado-*.json
          if-no-files-found: ignore

      - name: Abrir el issue con el acta
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESULTADO: ${{ job.status }}
        run: |
          set -euo pipefail
          fecha="$(date -u +'%Y-%m-%d')"
          cuerpo="$(node scripts/ensayo/verificar-restauracion.mjs --acta \
            --resultado "${RESULTADO}" \
            --corrida "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")"
          titulo="Acta de ensayo de restauración (automático) — ${fecha} — ${RESULTADO}"
          gh issue create --title "${titulo}" --label "operaciones" --body "${cuerpo}" \
            || gh issue create --title "${titulo}" --body "${cuerpo}"

      - name: Avisar si el ensayo falló
        if: failure()
        uses: ./.github/actions/alerta-correo
        with:
          asunto: "El ensayo de restauración falló"
          texto: |
            El ensayo no pudo completar ambas copias. El acta registra por separado lo que ocurrió con la diaria y con la mensual, y los resultados de las que sí se verificaron.
            Corrida: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
